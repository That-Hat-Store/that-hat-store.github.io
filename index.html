<!DOCTYPE html>
<html lang="en">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://www.w3schools.com/w3css/4/w3.css">
<link rel="icon" type="image/x-icon" href="favicon.png">
<style>
  body, html {
    height: 100%;
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
  }

  .hero-image {
    background-image: linear-gradient(rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0.5)), url("photos/404/4042.png");
    height: 100vh;
    background-position: center;
    background-repeat: no-repeat;
    background-size: cover;
    position: relative;
  }

  .hero-text {
    text-align: center;
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    color: white;
    padding: 0 20px;
  }

  .hero-text h1 {
    font-size: 8vw; /* Responsive font size */
  }

  .hero-text p {
    font-size: 4vw; /* Responsive paragraph size */
  }

  .hero-text button {
    border: none;
    outline: 0;
    display: inline-block;
    padding: 10px 25px;
    color: black;
    background-color: #ddd;
    text-align: center;
    cursor: pointer;
    font-size: 4vw;
  }

  .hero-text button:hover {
    background-color: #555;
    color: white;
  }

  /* Footer styling */
  footer {
    text-align: center;
    padding: 16px;
  }

  footer p, footer img {
    display: block;
    margin: 10px auto;
    max-width: 100%;
  }

  /* Media Query for screens smaller than 600px */
  @media screen and (max-width: 600px) {
    .hero-text h1 {
      font-size: 6vw; /* Smaller font size on mobile */
    }

    .hero-text p {
      font-size: 3.5vw;
    }

    .hero-text button {
      font-size: 3.5vw;
      padding: 8px 20px;
    }
  }
</style>
</head>
<body>

<div class="hero-image">
  <div class="hero-text">
    <h1>Currently Unavailable</h1>
    <p>The website is under maintenance right now. Please come back later.</p>
  </div>
</div>

<!-- Footer -->
<footer class="w3-black">
  <p>Powered by <a href="https://www.w3schools.com/w3css/default.asp" title="W3.CSS" target="_blank" class="w3-hover-text-green">w3.css</a></p>
  <p>© That Hat Store 2024. All rights reserved.</p>
  <img src="photos/cardsfull.png" alt="Payment Methods">
</footer>

</body>
</html>
